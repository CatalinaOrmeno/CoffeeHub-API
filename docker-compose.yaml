version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coffeehub_postgres
    environment:
      POSTGRES_DB: coffeehub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
  
  mongo:
    image: mongo:6.0
    container_name: coffeehub_mongo
    ports:
      - "27017:27017"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - postgres
    networks:
      - app-network

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge